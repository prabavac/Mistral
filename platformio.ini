; Mistral: thrust-vectored coaxial contra-rotating drone
; platformio.ini lives at the repo root; firmware sources are remapped into firmware/.

[platformio]
src_dir = firmware/src
lib_dir = firmware/lib
include_dir = firmware/include

[env:heltec_wifi_lora_32_V3]
; pioarduino fork: arduino-esp32 3.3.8, the core Zephyr's LEDC setup was validated on.
; The registry's platformio/espressif32 still ships core 2.0.17, which has no
; ledcAttachChannel and whose ledcWrite takes a channel, not a pin.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Keep the serial monitor from toggling DTR/RTS, which resets the board on connect.
monitor_dtr = 0
monitor_rts = 0
; web/index.html is the ground-station page's only copy. Linked into the image as a
; NUL-terminated blob (_binary_web_index_html_start/_end) and served from flash by wifi_link.
board_build.embed_txtfiles = web/index.html
; include_dir only reaches src/; this makes mistral_config.h visible to firmware/lib modules too.
build_flags =
    -I firmware/include
    ; AsyncTCP's network task on core 0, away from the control loop. Must match cfg::WIFI_CORE.
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
lib_deps =
    olikraus/U8g2
    adafruit/Adafruit BMP3XX Library
    adafruit/Adafruit BusIO
    adafruit/Adafruit Unified Sensor
    esp32async/AsyncTCP
    esp32async/ESPAsyncWebServer
    bblanchon/ArduinoJson
    ; ICM-42688-P driver, pinned to the version the bench sketch ran (see lib/sensors/imu.h).
    finani/ICM42688@1.1.0
