; Mistral — thrust-vectored coaxial contra-rotating drone
; platformio.ini lives at the repo root; firmware sources are remapped into firmware/.

[platformio]
src_dir = firmware/src
lib_dir = firmware/lib
include_dir = firmware/include

[env:heltec_wifi_lora_32_V3]
; pioarduino fork — arduino-esp32 3.3.8, the core Zephyr's LEDC setup was validated on.
; The registry's platformio/espressif32 still ships core 2.0.17, which has no
; ledcAttachChannel and whose ledcWrite takes a channel, not a pin.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Keep the serial monitor from toggling DTR/RTS, which resets the board on connect.
monitor_dtr = 0
monitor_rts = 0
; include_dir only reaches src/; this makes mistral_config.h visible to firmware/lib modules too.
build_flags = -I firmware/include
lib_deps =
    olikraus/U8g2
    adafruit/Adafruit BMP3XX Library
    adafruit/Adafruit BusIO
    adafruit/Adafruit Unified Sensor
; ICM-42688 driver library is chosen during bring-up.
